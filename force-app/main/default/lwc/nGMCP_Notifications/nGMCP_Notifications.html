    <template if:true={openPanel}>
    <div class="notif-popup" onclick={stopPropagation}>

        <!-- HEADER -->
        <div class="popup-header slds-grid slds-grid_align-spread slds-p-bottom_x-small">
            <span class="popup-title">Notifications</span>

            <button
                class="close-btn"
                title="Close"
                onclick={togglePanel}>
                ✕
            </button>
        </div>

        <!-- MARK ALL -->
        <div class="popup-actions slds-grid slds-grid_align-end">
            <button
                class="custom-notif-read-all-btn"
                onclick={handleMarkAllRead}>
                Mark all as Read
            </button>
        </div>

        <!-- NOTIFICATIONS -->
        <template if:true={notifications.length}>
            <div class="notif-list">
                <template for:each={notifications} for:item="notif">
                    <div key={notif.id} class="notif-item">
                        <div class="notif-text">
                            {notif.text}
                        </div>

                        <div class="notif-footer slds-grid slds-grid_align-spread">
                            <span class="notif-date">
                                {notif.createdDate}
                            </span>

                            <a
                                href="javascript:void(0);"
                                data-id={notif.id}
                                onclick={handleMarkRead}>
                                Mark as Read
                            </a>


                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- EMPTY STATE (Salesforce-like) -->
        <template if:false={notifications.length}>
            <div class="no-notif slds-text-align_center slds-p-around_small">
                You don't have any notifications right now.
            </div>
        </template>

    </div>
</template>
