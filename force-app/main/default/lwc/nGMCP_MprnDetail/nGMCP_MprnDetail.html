<template>
    <template if:true={renderthecomponent}>
        <template if:false={isLogger}>
            <template if:false={isCreateJobVisible}>
                <div
                    class="mprn-detail-outer-container slds-grid slds-grid_align-spread slds-grid_vertical slds-var-p-around_medium">
                    <!-- Header -->
                    <div
                        class="header slds-grid_vertical-align-center slds-col slds-grid slds-grid_align-spread slds-var-p-horizontal_medium">
                        <div class="left slds-col slds-grid slds-grid_vertical-align-center">
                            <span class="mprn-detail-title slds-col">MPRN: {customerDetails.MprnCustomer}</span>
                            <span
                                class="mprn-detail-status slds-col slds-var-p-vertical_x-small slds-var-p-horizontal_medium slds-var-m-around_small">{status}</span>
                        </div>
                        <div class="right slds-col">

                            <template if:true={customerDetails.appointmentFlag}>
                                <button
                                    class="btn custom-btn slds-var-p-vertical_x-small slds-var-p-horizontal_large slds-var-m-around_xx-small"
                                    onclick={handleCreateJobClick} data-request="WORK">
                                    Work Request
                                </button>
                            </template>
                            <template if:true={hasDisplayedAssetDetails}>
                                <button
                                    class="btn custom-btn slds-var-p-vertical_x-small slds-var-p-horizontal_large slds-var-m-around_xx-small"
                                    onclick={handleCreateJobClick} data-request="OFF_GAS">
                                    Off Gas
                                </button>
                            </template>
                            <template if:true={customerDetails.appointmentFlag}>
                                <button
                                    class="btn custom-btn slds-var-p-vertical_x-small slds-var-p-horizontal_large slds-var-m-around_xx-small"
                                    onclick={handleCreateJobClick} data-request="DATA_QUERY">
                                    Data Query
                                </button>
                            </template>

                            <template if:true={technicalQueryHide}>
                                <button
                                    class="btn custom-btn slds-var-p-vertical_x-small slds-var-p-horizontal_large slds-var-m-around_xx-small"
                                    onclick={handleCreateJobClick} data-request="TECH_QUERY">
                                    Technical Query
                                </button>
                            </template>

                            <template if:false={isDeappointAllowed}>
                                <template if:true={hasDisplayedAssetDetails}>
                                    <button
                                        class="btn custom-btn slds-var-p-vertical_x-small slds-var-p-horizontal_large slds-var-m-around_xx-small"
                                        onclick={handleCreateJobClick} data-request="APPOINT">
                                        Appoint
                                    </button>
                                </template>
                            </template>

                            <template if:true={isDeappointAllowed}>
                                <button
                                    class="btn deappoint slds-var-p-vertical_x-small slds-var-p-horizontal_large slds-var-m-around_xx-small"
                                    onclick={handleCreateJobClick} data-request="DEAPPOINT">
                                    De-appoint
                                </button>
                            </template>

                        </div>

                    </div>
                    <div
                        class="header slds-grid_vertical-align-center slds-col slds-grid slds-grid_align-spread slds-var-p-horizontal_medium">
                        <template if:true={shouldMaskData}>
                            <span class="tab-header slds-col">
                                {mprnErrorMessage}
                            </span>
                        </template>
                    </div>

                    <!-- Tab Header -->
                    <div class="tab-header slds-col slds-grid slds-var-p-around_medium">
                        <div class={overviewClass} onclick={selectOverview}>Overview</div>
                        <div class={requestLogClass} onclick={selectRequestLog}>Request log</div>
                        <div class={workOrderLogClass} onclick={selectWorkOrderLog}>Work order log</div>
                    </div>

                    <!-- Selected Tab Content -->
                    <template if:true={isOverview}>
                        <div
                            class="mprn-detail-row-layout slds-col slds-grid slds-grid_align-spread slds-var-p-bottom_medium slds-wrap">
                            <div class="slds-grid slds-grid_vertical slds-size_6-of-12">

                                <!-- Address Details -->
                                <div class="details-column slds-col slds-var-p-horizontal_medium">
                                    <div
                                        class="section-header slds-grid slds-grid_align-spread slds-var-p-horizontal_medium slds-var-p-vertical_x-small">
                                        <h3 class="mprn-detail-section-title slds-col">Address details
                                        </h3>
                                        <template if:false={shouldMaskData}>
                                            <button class="mprn-detail-edit slds-col" onclick={handleEdit}><span
                                                    class="mprn-detail-edit-icon slds-grid slds-var-m-horizontal_x-small"></span>Edit</button>
                                        </template>
                                    </div>
                                    <div class="details-box slds-p-horizontal_medium">
                                        <template if:true={isEditing}>
                                            <div class="slds-p-horizontal_medium">
                                                <div class="form-field">
                                                    <label>Building number</label>
                                                    <div class="custom-input-element-section">
                                                        <input type="text" value={customerDetails.buildingNumber}
                                                            oninput={handleInputChange} data-field="building"
                                                            maxlength="40" />
                                                    </div>
                                                </div>
                                                <div class="form-field">
                                                    <label>Building name</label>
                                                    <div class="custom-input-element-section">
                                                        <input type="text" value={customerDetails.buildingName}
                                                            oninput={handleInputChange} data-field="buildingName"
                                                            maxlength="40" />
                                                    </div>
                                                </div>
                                                <div class="form-field">
                                                    <label>Street</label>
                                                    <div class="custom-input-element-section">
                                                        <input type="text" value={customerDetails.street}
                                                            oninput={handleInputChange} data-field="street"
                                                            maxlength="40" />
                                                    </div>
                                                </div>
                                                <div class="form-field">
                                                    <label>Dependent locality</label>
                                                    <input type="text" value={customerDetails.dependentLocality}
                                                        oninput={handleInputChange} data-field="dependent"
                                                        maxlength="40" />
                                                </div>
                                                <div class="form-field">
                                                    <label>Postal town</label>
                                                    <div class="custom-input-element-section">
                                                        <input type="text" value={customerDetails.postalTown}
                                                            oninput={handleInputChange} data-field="town"
                                                            maxlength="40" />
                                                    </div>
                                                </div>
                                                <div class="form-field">
                                                    <label>Postal code</label>
                                                    <div class="custom-input-element-section">
                                                        <input type="text" value={customerDetails.postCode}
                                                            oninput={handleInputChange} data-field="postal"
                                                            maxlength="10" />
                                                    </div>
                                                </div>
                                                <div class="slds-p-vertical_small">
                                                    <button
                                                        class="btn custom-btn slds-var-p-vertical_x-small slds-var-p-horizontal_large slds-var-m-around_xx-small"
                                                        onclick={handleSave}>Save</button>
                                                    <button
                                                        class="btn deappoint slds-var-p-vertical_x-small slds-var-p-horizontal_large slds-var-m-around_xx-small"
                                                        onclick={handleCancel}>Cancel</button>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:false={isEditing}>

                                            <!-- Building number -->
                                            <div
                                                class="mprn-detail-row with-border slds-p-horizontal_medium slds-p-vertical_x-small slds-grid slds-grid_align-spread">
                                                <div
                                                    class="mprn-detail-label slds-col slds-size_5-of-12 slds-text-align_left">
                                                    Building number
                                                </div>
                                                <div
                                                    class="mprn-detail-value slds-col slds-size_7-of-12 slds-text-align_right">
                                                    <template if:true={shouldMaskData}>
                                                        <span
                                                            class="masked-black">{customerDetails.buildingNumber}</span>
                                                    </template>
                                                    <template if:false={shouldMaskData}>
                                                        {customerDetails.buildingNumber}
                                                    </template>
                                                </div>
                                            </div>

                                            <!-- Building name -->
                                            <div
                                                class="mprn-detail-row with-border slds-p-horizontal_medium slds-p-vertical_x-small slds-grid slds-grid_align-spread">
                                                <div
                                                    class="mprn-detail-label slds-col slds-size_5-of-12 slds-text-align_left">
                                                    Building name
                                                </div>
                                                <div
                                                    class="mprn-detail-value slds-col slds-size_7-of-12 slds-text-align_right">
                                                    <template if:true={shouldMaskData}>
                                                        <span class="masked-black">{customerDetails.buildingName}</span>
                                                    </template>
                                                    <template if:false={shouldMaskData}>
                                                        {customerDetails.buildingName}
                                                    </template>
                                                </div>
                                            </div>

                                            <!-- Street -->
                                            <div
                                                class="mprn-detail-row with-border slds-p-horizontal_medium slds-p-vertical_x-small slds-grid slds-grid_align-spread">
                                                <div
                                                    class="mprn-detail-label slds-col slds-size_5-of-12 slds-text-align_left">
                                                    Street
                                                </div>
                                                <div
                                                    class="mprn-detail-value slds-col slds-size_7-of-12 slds-text-align_right">
                                                    <template if:true={shouldMaskData}>
                                                        <span class="masked-black">{customerDetails.street}</span>
                                                    </template>
                                                    <template if:false={shouldMaskData}>
                                                        {customerDetails.street}
                                                    </template>
                                                </div>
                                            </div>

                                            <!-- Dependent locality -->
                                            <div
                                                class="mprn-detail-row with-border slds-p-horizontal_medium slds-p-vertical_x-small slds-grid slds-grid_align-spread">
                                                <div
                                                    class="mprn-detail-label slds-col slds-size_5-of-12 slds-text-align_left">
                                                    Dependent locality
                                                </div>
                                                <div
                                                    class="mprn-detail-value slds-col slds-size_7-of-12 slds-text-align_right">
                                                    <template if:true={shouldMaskData}>
                                                        <span
                                                            class="masked-black">{customerDetails.dependentLocality}</span>
                                                    </template>
                                                    <template if:false={shouldMaskData}>
                                                        {customerDetails.dependentLocality}
                                                    </template>
                                                </div>
                                            </div>

                                            <!-- Postal town -->
                                            <div
                                                class="mprn-detail-row with-border slds-p-horizontal_medium slds-p-vertical_x-small slds-grid slds-grid_align-spread">
                                                <div
                                                    class="mprn-detail-label slds-col slds-size_5-of-12 slds-text-align_left">
                                                    Postal town
                                                </div>
                                                <div
                                                    class="mprn-detail-value slds-col slds-size_7-of-12 slds-text-align_right">
                                                    <template if:true={shouldMaskData}>
                                                        <span class="masked-black">{customerDetails.postalTown}</span>
                                                    </template>
                                                    <template if:false={shouldMaskData}>
                                                        {customerDetails.postalTown}
                                                    </template>
                                                </div>
                                            </div>

                                            <!-- Postal code -->
                                            <div
                                                class="mprn-detail-row with-border slds-p-horizontal_medium slds-p-vertical_x-small slds-grid slds-grid_align-spread">
                                                <div
                                                    class="mprn-detail-label slds-col slds-size_5-of-12 slds-text-align_left">
                                                    Postal code
                                                </div>
                                                <div
                                                    class="mprn-detail-value slds-col slds-size_7-of-12 slds-text-align_right">
                                                    <template if:true={shouldMaskData}>
                                                        <span class="masked-black">{customerDetails.postCode}</span>
                                                    </template>
                                                    <template if:false={shouldMaskData}>
                                                        {customerDetails.postCode}
                                                    </template>
                                                </div>
                                            </div>

                                        </template>
                                        <template if:true={isLoading}>
                                            <div class="custom-spinner-container">
                                                <div class="custom-spinner">
                                                    <span></span>
                                                    <span></span>
                                                    <span></span>
                                                    <span></span>
                                                    <span></span>
                                                    <span></span>
                                                    <span></span>
                                                    <span></span>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:true={showSuccessMessage}>
                                            <div
                                                class="custom-success-message slds-grid slds-m-around_medium slds-grid_vertical-align-center">
                                                {messageText}
                                            </div>
                                        </template>
                                        <template if:true={errorMessage}>
                                            <div
                                                class="custom-error-message slds-grid slds-m-around_medium slds-grid_vertical-align-center">
                                                {messageText}
                                            </div>
                                        </template>

                                    </div>
                                </div>

                                <!--  Site Details -->
                                <div class="details-column slds-col slds-var-p-around_medium">
                                    <template if:true={showSiteDetails}>
                                        <div
                                            class="section-header slds-grid slds-grid_align-spread slds-var-p-horizontal_medium slds-var-p-vertical_x-small">
                                            <h3 class="mprn-detail-section-title slds-col">Site Details</h3>
                                        </div>
                                        <div class="details-box slds-p-horizontal_medium">
                                            <template for:each={siteDetails} for:item="item">
                                                <div class="mprn-detail-row with-border slds-p-horizontal_medium slds-p-vertical_x-small slds-grid slds-grid_align-spread"
                                                    key={item.label}>
                                                    <div
                                                        class="mprn-detail-label slds-col slds-size_5-of-12 slds-text-align_left">
                                                        {item.label}
                                                    </div>
                                                    <div
                                                        class="mprn-detail-value slds-col slds-size_7-of-12 slds-text-align_right">
                                                        {item.value}
                                                    </div>
                                                </div>
                                            </template>

                                        </div>

                                    </template>
                                </div>

                            </div>
                            <!--</div>
                <div class="mprn-detail-row-layout slds-col slds-grid slds-grid_align-spread slds-var-p-bottom_medium">-->
                            <div class="slds-grid slds-grid_vertical slds-size_6-of-12">

                                <!-- Meter Details -->
                                <div class="details-column slds-col slds-var-p-horizontal_medium">
                                    <div
                                        class="section-header slds-grid slds-grid_align-spread slds-var-p-horizontal_medium slds-var-p-vertical_x-small">
                                        <h3 class="mprn-detail-section-title slds-col">Meter details</h3>

                                    </div>
                                    <div class="details-box slds-p-horizontal_medium">
                                        <template for:each={displayedAssetDetails} for:item="item">
                                            <div class="mprn-detail-row with-border slds-p-horizontal_medium slds-p-vertical_x-small slds-grid slds-grid_align-spread"
                                                key={item.label}>
                                                <div
                                                    class="mprn-detail-label slds-col slds-size_5-of-12 slds-text-align_left">
                                                    {item.label}
                                                </div>
                                                <div
                                                    class="mprn-detail-value slds-col slds-size_7-of-12 slds-text-align_right">
                                                    <!--{item.value}-->
                                                    <template if:true={item.shouldMask}>
                                                        <span class="masked-black">{item.value}</span>
                                                    </template>

                                                    <template if:false={item.shouldMask}>
                                                        {item.value}
                                                    </template>

                                                </div>
                                            </div>
                                        </template>
                                        <template if:true={hasMoreAssetDetails}>
                                            <div class="expand-link slds-p-horizontal_medium slds-p-vertical_x-small"
                                                onclick={toggleAssetExpand}>
                                                <span class="link-text">{assetToggleText}</span>
                                                <span class={assetArrowClass}>&gt;</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Converter Details -->
                                <div class="details-column slds-col slds-var-p-around_medium">
                                    <template if:true={showConverterDetails}>
                                        <div
                                            class="section-header slds-grid slds-grid_align-spread slds-var-p-horizontal_medium slds-var-p-vertical_x-small">
                                            <h3 class="mprn-detail-section-title slds-col">Converter Details</h3>
                                        </div>
                                        <div class="details-box slds-p-horizontal_medium">
                                            <template for:each={ConverterDetails} for:item="item">
                                                <div class="mprn-detail-row with-border slds-p-horizontal_medium slds-p-vertical_x-small slds-grid slds-grid_align-spread"
                                                    key={item.label}>
                                                    <div
                                                        class="mprn-detail-label slds-col slds-size_5-of-12 slds-text-align_left">
                                                        {item.label}
                                                    </div>
                                                    <div
                                                        class="mprn-detail-value slds-col slds-size_7-of-12 slds-text-align_right">
                                                        <template if:true={item.shouldMask}>
                                                            <span class="masked-black">{item.value}</span>
                                                        </template>
                                                        <template if:false={item.shouldMask}>
                                                            {item.value}
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:true={isCreateJobVisible}>
                <c-n-g-m-c-p_-create-job-request metadata-record={metaDataWrapper} asset-details={assetDetails}
                    converter-details={converterDetails} converter-serial-no={converterSerialNo}
                    address-details={address} status={status} payment-mechanism={paymentMechanism} post-code={postCode}
                    mprn={customerDetails.MprnCustomer} pressuretier={customerDetails.pressureTier}
                    pressuretier-brand={customerDetails.presureBrand} oncancelcreatejob={handleCancelJob}
                    request-source={selectedCreateRequestType} radio-card-flag={customerDetails.appointmentFlag}
                    is-allow-deappointment={isDeappointAllowed} haszoo2={customerDetails.hasZ002} msn={msn}
                    location={customerDetails.MPRN} siteid={customerDetails.siteid}
                    is-deappoint-allowed={isDeappointAllowed} should-mask-data={shouldMaskData}
                    customer={customerDetails}
                    locationsid={customerDetails.locationsId}></c-n-g-m-c-p_-create-job-request>
            </template>
        </template>
        <template if:true={isLogger}>
            <template if:true={showViewRequest}>
                <c-n-g-m-c-p-_view-request-component filters={filters}
                    request-logger-flag={isLogger}></c-n-g-m-c-p-_view-request-component>
            </template>
            <template if:true={workOrderrequestFlag}>
                <c-n-g-m-c-p_view-work-order-component filters={woFilters}
                    request-logger-flag={isLogger}></c-n-g-m-c-p_view-work-order-component>
            </template>
        </template>
    </template>
</template>
