<template>
    <!-- Initial Screen (just a button) -->
    <!-- 1) SHOW BUTTON ONLY IF FLAG IS TRUE -->
    <template if:true={showActionButton}>
        <div class="slds-p-around_large slds-align_absolute-center">
            <lightning-button label="Provide Site Contact Details" variant="brand" onclick={openFormModal}>
            </lightning-button>
        </div>
    </template>
    <!-- Modal Form -->
    <template if:true={showFormModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">Enter Site Contact Details</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Title" data-field="title" required></lightning-input>
                    <lightning-input label="Name" data-field="name" required></lightning-input>
                    <lightning-input type="tel" label="Contact Number" data-field="phone" required></lightning-input>
                    <lightning-textarea label="Access Instructions" data-field="access" required>
                    </lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeFormModal}>
                    </lightning-button>
                    <lightning-button variant="brand" class="slds-m-left_small" label="Submit" onclick={handleSubmit}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- Success/Error Popup -->
    <template if:true={showPopup}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">{popupTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{popupMessage}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="brand" label="OK" onclick={closePopup}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
