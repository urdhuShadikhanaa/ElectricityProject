<template>
    <div class="sidebar">
        <img src={logoUrl} alt="Logo" class="logo" />
        <ul class="menu">
            <li class={homeClass} data-id="home" onclick={handleMenuClick}>Home</li>

            <li class={requestsClass} data-id="requests" onclick={handleMenuClick}>
                Requests
                <img src={requestArrowIcon} alt="toggle" class="arrow-icon" />
            </li>
            <template if:true={isRequestOpen}>
                <li class={createRequestClass} data-id="createRequest" onclick={handleMenuClick}>Create Request</li>
                <li class={viewRequestClass} data-id="viewRequest" onclick={handleMenuClick}>View Request</li>
            </template>

            <li class={reportsClass} data-id="reports" onclick={handleMenuClick}>Reports</li>
            <li class={userClass} data-id="user" onclick={handleMenuClick}>User</li>
        </ul>
    </div>
</template>
