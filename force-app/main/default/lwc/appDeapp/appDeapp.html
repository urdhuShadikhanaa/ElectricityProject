<template>
    <!-- Main Options -->
    <div class="radio-card-group">
        <template for:each={mainOptionsWithClass} for:item="option">
            <div key={option.value} class={option.className} onclick={handleCardClick}>
                <input type="radio" name="mainOptions" value={option.value} checked={option.checked} />
                <div class="radio-card-label">{option.label}</div>
                <div class="radio-card-help">{option.helpText}</div>
            </div>
        </template>
    </div>

    <!-- Deappointment Section -->
    <template if:true={isDeappointment}>
        <h3>Select Deappointment Type</h3>
        <div class="radio-card-group">
            <template for:each={deappointmentOptionsWithClass} for:item="option">
                <div key={option.value} class={option.className} onclick={handleDeCardClick}>
                    <input type="radio" name="deappointmentTypes" value={option.value} checked={option.checked} />
                    <div class="radio-card-label">{option.label}</div>
                    <div class="radio-card-help">{option.helpText}</div>
                </div>
            </template>
        </div>

       
    <template if:true={showCommonFields}>
        <div class="two-column">
            <div class="inline-field">
                <span class="custom-label">Effective Date:</span>
                <lightning-input
                    class="compact-input"
                    type="date"
                    value={effectiveDate}
                    onchange={handleEffectiveDateChange} required message-when-value-missing="Effective Date is required.">
                </lightning-input>
            </div>
            <div class="inline-field">
                <span class="custom-label">Meter Link Code:</span>
                <lightning-combobox
                    class="compact-input"
                    value={meterLinkCode}
                    options={meterLinkOptions}
                    onchange={handleMeterLinkChange} required message-when-value-missing="Meter Link Code is required.">
                </lightning-combobox>
            </div>
        </div>
    </template>


        
<!-- COS Specific: required only when isCOSDe -->
  <template if:true={isCOSDe}>
    <div class="inline-field">
      <lightning-input
        class="compact-input"
        type="text"
        label="New Supplier Short Code"
        value={newSupplierShortCode}
        onchange={handleNewSupplierShortCodeChange}
        required
        message-when-value-missing="This field is required."
      ></lightning-input>
    </div>
  </template>


        <!-- Submit Button -->
        <div class="submit-btn">
            <lightning-button variant="brand" label="Submit Deappointment" onclick={handleSubmitAppointment}></lightning-button>
        </div>
    </template>

    <!-- Appointment Section -->
    <template if:true={isAppointment}>
        <h3>Select Appointment Type</h3>
        <div class="radio-card-group">
            <template for:each={appointmentOptionsWithClass} for:item="option">
                <div key={option.value} class={option.className} onclick={handleAppCardClick}>
                    <input type="radio" name="appointmentTypes" value={option.value} checked={option.checked} />
                    <div class="radio-card-label">{option.label}</div>
                    <div class="radio-card-help">{option.helpText}</div>
                </div>
            </template>
        </div>

         
    <template if:true={showCommonFields}>
        <div class="two-column">
            <div class="inline-field">
                <span class="custom-label">Effective Date:</span>
                <lightning-input
                    class="compact-input"
                    type="date"
                    value={effectiveDate}
                    onchange={handleEffectiveDateChange} required message-when-value-missing="This field is required.">
                </lightning-input>
            </div>
            <div class="inline-field">
                <span class="custom-label">Meter Link Code:</span>
                <lightning-combobox
                    class="compact-input"
                    value={meterLinkCode}
                    options={meterLinkOptions}
                    onchange={handleMeterLinkChange} required message-when-value-missing="This field is required.">
                </lightning-combobox>
            </div>
        </div>
    </template>
