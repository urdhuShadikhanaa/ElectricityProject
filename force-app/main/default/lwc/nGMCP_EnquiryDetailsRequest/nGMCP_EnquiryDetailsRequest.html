<template>
  <div class="container">
    <h1 class="page-title">Create New Enquiry</h1>

    <!-- Job required -->
    <section class="section-job">
      <h2 class="section-title">Job required</h2>
      <!-- Request Type -->
      <p class="field-label">Select request type</p>
      <div class="radio-grid">
        <template for:each={requestTypes} for:item="type">
          <div key={type.value} class="radio-card" data-group="requestType" data-value={type.value} onclick={handleCardClick}>
            <div class="radio-header">
              <input type="radio" name="requestType" value={type.value} />
              <label>{type.label}</label>
            </div>
            <p class="radio-desc">{type.desc}</p>
          </div>
        </template>
      </div>

      
    <!-- DQ Types -->
    <template if:true={showDqTypes}>
      <p class="field-label">Enquiry Reason Code</p>
      <div class="radio-grid">
        <template for:each={DqTypes} for:item="type">
          <div key={type.value} class="radio-card" data-group="DqTypes" data-value={type.value} onclick={handleCardClick}>
            <div class="radio-header">
              <input type="radio" name="DqTypes" value={type.value}/>
              <label>{type.label}</label>
            </div>
            <p class="radio-desc">{type.desc}</p>
          </div>
        </template>
      </div>
    </template>

    <!-- DQ SubTypes (same card style; hidden for MSE) -->
    <template if:true={showSubDqTypes}>
      <p class="field-label">Enquiry Category</p>
      <div class="radio-grid">
        <template for:each={SubDqTypes} for:item="type">
          <div key={type.value} class="radio-card" data-group="SubDqTypes" data-value={type.value} onclick={handleCardClick}>
            <div class="radio-header">
              <input type="radio" name="SubDqTypes" value={type.value}/>
              <label>{type.label}</label>
            </div>
            <p class="radio-desc">{type.desc}</p>
          </div>
        </template>
      </div>
    </template>

    <!-- MSE-only form -->
    <template if:true={showMseForm}>
      <div class="mse-form">
        <h3 class="subheading">Sample Enquiry Description</h3>
        <textarea name="sampleDescription" class="textarea" onchange={handleMseInputChange} placeholder="Enter description…">{mseForm.sampleDescription}</textarea>

        <h3 class="subheading">Please provide below details</h3>
        <div class="form-grid">
          <div class="form-field">
            <label class="label" for="serialNumber">New Meter Serial Number</label>
            <input
              id="serialNumber"
              class="input"
              type="text"
              name="serialNumber"
              value={mseForm.serialNumber}
              onchange={handleMseInputChange}
              required
            />
          </div>

          <div class="form-field">
            <label class="label" for="manufacturer">New Meter Manufacturer</label>
            <input 
            id="manufacturer"
             class="input"
              type="text"
               name="manufacturer"
                value={mseForm.manufacturer}
                 onchange={handleMseInputChange}
                  required />
          </div>
          <div class="form-field">
            <label class="label" for="meterRead">New Meter Read</label>
            <input 
            id="meterRead"
             class="input" 
             type="number" 
             name="meterRead" 
             value={mseForm.meterRead}
              onchange={handleMseInputChange} 
              required />
          </div>
        </div>

        <div class="form-field">
          <label class="label" for="additionalInfo">Additional information (Optional)</label>
          <input id="additionalInfo" class="input" type="text" name="additionalInfo" value={mseForm.additionalInfo} onchange={handleMseInputChange} placeholder="Share any additional helpful information for enquiry resolution" />
          <small class="helper">Max 210 characters left</small>
        </div>
      </div>
    </template>


    



      <!-- Job Type -->
      <template if:true={showJobType}>
        <p class="field-label">Select jobtype</p>
        <div class="radio-grid">
          <template for:each={jobTypes} for:item="job">
            <div key={job.value} class="radio-card" data-group="jobType" data-value={job.value} onclick={handleCardClick}>
              <div class="radio-header">
                <input type="radio" name="jobType" value={job.label} checked={selectedJobType} onchange={handleCategorySelect} />
                <label>{job.label}</label>
              </div>
              <p class="radio-desc">{job.description}</p>
              <div class="recommend-tag">We recommend this based on the asset details </div>
              <!-- <template if:true={job.recommended}><div class="recommend-tag">We recommend this based on the asset details </div></template> -->
            </div>
          </template>
          <template if:true={showWindOnOption}>
              <div class="radio-card">
                <div class="radio-header">
                  <input type="radio" name="jobType" value="windOn" />
                </div>
                  <div class="radio-content">
                      <h3>Wind on</h3>
                      <p>Supporting line text lorem ipsum dolor sit amet, consectetur.</p>
                  </div>
              </div>
          </template>
        </div>
        <p class="help-text">If asset details are incorrect call: <a href="tel:+4412345678">+44 12345678</a>
        </p>
      </template>
     
      <!-- Start Options -->
      <template if:true={showAppointment}>
                <p class="field-label">Select start</p>
                <div class="radio-grid small">
                    <template for:each={startOptions} for:item="opt">
                        <div key={opt.value} class="radio-card short-height" data-group="startOption"
                            data-value={opt.value} onclick={handleCardClick}>
                            <div class="radio-header">
                                <input type="radio" name="startOption" value={opt.value} />
                                <label>{opt.label}</label>
                            </div>
                        </div>
                    </template>
                </div>
      </template>
       <!-- Appointment date & slot (shown only if Pick date/time selected) -->
        <template if:true={showAppointmentFields}>
          <div class="field">
            <label>Appointment Date</label>
               <c-ngm-date-picker-with-holidays ondateselected={handleDateChange}></c-ngm-date-picker-with-holidays>
          </div>

          <div class="field-slot">
              <template if:true={appointmentOptions}>
                  <lightning-combobox
                      name="appointmentSlot"
                      label="Appointment Slot"
                      value={selectedSlot}
                      options={appointmentOptions}
                      onchange={handleSlotChange}
                      class="appointment-slot">
                  </lightning-combobox>
              </template>
          </div>
        </template>
    </section>
    <!-- Contact details -->
    <template if:true={showcontactdetails}>
      <section class="section">
        <h2 class="section-title">Contact details (on-site)</h2>
        <div class="field">
          <label>Title</label>
          <select name="title" onchange={handleInputChange}>
            <option value="">Choose title</option>
            <template for:each={titles} for:item="title">
              <option key={title} value={title}>{title}</option>
            </template>
          </select>
        </div>
        <div class="field">
          <label>Name</label>
          <input type="text" name="name" placeholder="Enter name" onchange={handleInputChange} />
        </div>
        <div class="field">
          <label>Contact number</label>
          <input type="text" name="contactNumber" placeholder="Enter contact number" onchange={handleInputChange} />
        </div>
        <div class="field">
          <label> Meter access instructions <span class="optional">(Optional)</span>
          </label>
          <textarea name="instructions" placeholder="Share helpful on-site information for the engineer" onchange={handleInputChange}></textarea>
          <p class="char-limit">Max 210 characters left</p>
        </div>
        <!-- Drag & Drop Upload Section -->
        <div class="upload-section">
            <label class="upload-label">Upload Photos (Optional)</label>
            <div class="upload-box"
                ondragover={handleDragOver}
                ondragleave={handleDragLeave}
                ondrop={handleFileDrop}>
                <p>Drag & drop</p>
                <p><span class="browse-text" onclick={handleBrowseClick}>select CSV file from local device</span></p>
                <input type="file" multiple accept=".csv, image/*" class="file-input" onchange={handleFileChange}/>
            </div>
        </div>
      </section>
    </template>
    <!-- Submit button -->
    <section class="section-btn">
      <div class="consent-box">
        <input type="checkbox" name="consent" onchange={handleInputChange} />
        <span class="consent-text"> By entering consumer personal data you confirm that consent has been obtained from the named individual for ... </span>
      </div>
      <button class="submit-btn" onclick={handleSubmitUrgentWorkrequest}>Submit Urgent Work Request</button>
      <button class="submit-btn" onclick={handleCancelClick}>Cancel</button>
    </section>
  </div>
</template>
