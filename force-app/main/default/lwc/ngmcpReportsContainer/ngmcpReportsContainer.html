                        <template if:true={rows.length}>
                            <template for:each={rows} for:item="row">
                                <div class="grid-row" role="row" key={row.recordId}>
                                    <div class="grid-cell link-cell" role="cell">
                                        <a href="javascript:void(0)" data-id={row.recordId} onclick={openRecord}>
                                            {row.name} </a>
                                    </div>
                                    <div class="grid-cell" role="cell">{row.SRnumber}</div>
                                    <template if:false={isshowQuoteStatus}>
                                        <div class={row.statusCellClass} role="cell">{row.status}</div>
                                    </template>
                                    <template if:true={isshowQuoteStatus}>
                                        <div class={row.statusCellClass} role="cell">{row.QuotationStatus}</div>
                                    </template>
                                    <div class="grid-cell" role="cell">{row.mprn}</div>
                                    <div class="grid-cell" role="cell">{row.jobcategory}</div>
                                    <div class="grid-cell" role="cell">{row.subcategory}</div>
                                    <div class="grid-cell" role="cell">{row.suppliercode}</div>
                                    <div class="grid-cell" role="cell">{row.CreatedOn}</div>
                                    <div class="grid-cell" role="cell">{row.BuildingName}</div>
                                    <div class="grid-cell" role="cell">{row.BuildingNumber}</div>
                                    <div class="grid-cell" role="cell">{row.Street}</div>
                                    <div class="grid-cell" role="cell">{row.DependentLocality}</div>
                                    <div class="grid-cell" role="cell">{row.Town}</div>
                                    <div class="grid-cell" role="cell">{row.PostCode}</div>
                                    <div class="grid-cell" role="cell">{row.CustomerName}</div>
                                    <div class="grid-cell" role="cell">{row.CustomerNumber}</div>
                                </div>
                            </template>
                        </template>
                        <!-- ================= EMPTY STATE ================= -->
                        <template if:false={rows.length}>
                            <div class="grid-row empty">
                                <div class="grid-cell">
                                    No records found.
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Pagination -->
            <div class="pagination slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                <div class="slds-col">
                    <button class="page-btn" onclick={goBack}> Back </button>
                    <button class="page-btn slds-m-horizontal_small" onclick={exportToCSV}
                        disabled={isExportDisabled}>Export</button>
                </div>

                <div class="slds-col">
                    <button class="page-btn" onclick={prevPage} disabled={isPrevDisabled}>Prev</button>
                    <span class="page-info slds-m-horizontal_small">Page {page} of {totalPages}</span>
                    <button class="page-btn" onclick={nextPage} disabled={isNextDisabled}>Next</button>
                </div>
            </div>
        </template>
    </template>
    <template if:true={showDetailView}>
        <div class="detail-wrapper">
            <c-n-g-m-c-p_dynamic-request-pages onreportback={handleReportsController} record-id={recordId}
                object-api-name={objectApiName} record-type-name={recordTypeName} report-container-flag=true>
            </c-n-g-m-c-p_dynamic-request-pages>
        </div>
    </template>
</template>
