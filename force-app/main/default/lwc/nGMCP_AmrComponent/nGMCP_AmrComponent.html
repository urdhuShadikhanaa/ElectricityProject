          <div class="radio-grid">          
      <label class={typeCardClassAMR}>

        </div>
                  <p class="radio-desc">Automated Meter Reading</p>
                  <template if:true={isAMRSelected}>
                    <div class="recommend-tag">Selected</div>
                  </template>
      </label>
    </div>

          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

                          <div class="radio-header">
              <input type="radio" name="subType" value={sub.label} onchange={handleSubTypeSelect} />
                            <label>{sub.label}</label>
            </div>
                          <p class="radio-desc">{sub.description}</p>
                          <template if:true={sub.isSelected}>

                          </template>
          </label>
        </template>
      </div>

    <div class="slds-text-color_error slds-m-bottom_small">
        Please select a Job Type
    </div>
</template>           
<template if:true={subTypeError}>
    <div class="slds-text-color_error slds-m-bottom_small">
        Please select a Sub Type
    </div>
</template>
  <div class="consent-box">
    <input type="checkbox" name="consent" checked={consent} onchange={handleInputChange} />
    <span class="consent-text"> Please tick here to confirm that consent has been obtained from the named individual
      for their personal data to be passed to third parties, for the purposes of performing the specified works, by
      means of a suitable Data Privacy Notice and explicit consent agreement.</span>
  </div>
  <template if:true={consentMessageFlag}>
    <p class="error-text">{consentMessage}</p>
  </template>
<div class="submit-row">
                    <button class="btn custom-btn" onclick={handleAmrSubmit}>Submit Request</button>
                    <button class="btn custom-btn-base" onclick={handleCancelClick}>Cancel</button>                  
  </div>
  <template if:true={isModal}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container custom-slds-modal-container">
        <!-- Header -->
        <header class="custom-modal-header slds-p-around_large">
          <h2 class="custom-modal-title">{requestHeader}</h2>
        </header>
          <!-- Body -->
        <template if:true={successMessage}>
          <div class="custom-modal-content-container slds-p-around_large">
            <div class="custom-modal-content slds-col slds-p-around_xx-small">{successMessage} <span
                class="custom-modal-content-bold"></span>
            </div>
            <div class="custom-modal-content slds-col slds-p-around_xx-small">{serviceTicketid} <span
                class="custom-modal-content-bold">{srNumber}</span>
            </div>
            <template if:true={nonPulsingInstallorRemove}>
              <div class="custom-modal-content slds-col slds-p-around_xx-small">{relatedSuccessMessage} <span
                  class="custom-modal-content-bold"></span>
              </div>
              <div class="custom-modal-content slds-col slds-p-around_xx-small">{relatedServiceTicketMessage} <span
                  class="custom-modal-content-bold">{relatedSRnumber}</span>
              </div>
            </template>
          </div>
        </template>
        <template if:true={duplicateMessage}>
          <div class="custom-modal-content-container slds-p-around_large">
            <div class="custom-modal-content slds-col slds-p-around_xx-small">{duplicateMessage}
            </div>
          </div>
        </template>
        <!-- Footer -->
        <footer class="custom-modal-footer slds-grid slds-grid_align-end slds-p-around_large">
          <button class="slds-button slds-p-vertical_x-small slds-p-horizontal_large custom-modal-brand-button"
            disabled={isDisabled} onclick={handleCancelClick}> Ok </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
