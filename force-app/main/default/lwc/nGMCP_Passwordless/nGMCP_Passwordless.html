<template>
    <template if:true={loginPage}>
        <div class="">
            <div class="">
                <div class="login-form-input">
                    <label class="custom-label" for="username">Username</label>
                    <input type='text' class="slds-size_3-of-3 slds-m-vertical_x-small input-container"
                        onchange={handleIdentifier}></input>
                </div>
                <template if:true={validationErrors.email}>
                    <div class="error-message">{validationErrors.email}</div>
                </template>
                <div class="login-form-input">
                    <label class="custom-label" for="password">Password</label>
                    <input type='password' class="slds-size_3-of-3 slds-m-vertical_x-small input-container"
                        onchange={handlePasswordChange} onkeypress={handleKeyPress}></input>
                </div>
                <template if:true={validationErrors.password}>
                    <div class="error-message">{validationErrors.password}</div>
                </template>
                <template if:true={showErrorMessage}>
                    <div class="error-message">
                        <p class="ngmcp-text-error">{errorMessage}</p>
                    </div>
                </template>

                <div class="custom-login-btn-block">
                    <button
                        class="custom-login-button slds-m-vertical_large slds-size_3-of-3 slds-button slds-p-around_x-small slds-grid_align-center"
                        onclick={handleSendOtp}>Login
                    </button>
                </div>
            </div>
        </div>

    </template>
    <template if:true={otpPage}>
        <div class="otp-card custom-otp--section">
            <!--<div class="otpVerifyText">Verify OTP</div>-->
            <p class="custom-subtitle slds-m-around_medium">We have sent a <span
                    class="custom-subtitle-bold">Verification Code</span> to your email <br><span class="center-text">
                                which will be valid for&nbsp;
                                <span class="custom-subtitle-bold">15 minutes.</span>
                            </span></p>

            <div class="form-group">
                <lightning-input class="input-container slds-form-element" label="Please Enter Verification Code"
                    name="otp" type="text" max=6 value={otp} onchange={handleOtpChange} onkeypress={handlePressKey}>
                </lightning-input>
            </div>

            <template if:true={showErrorMessage}>
                <div class="error-message">
                    <p class="ngmcp-text-error">{errorMessage}</p>
                </div>
            </template>

            <div class="resend-container slds-var-m-vertical_small slds-p-horizontal_small slds-grid_align-center">
                <button title="Resend OTP"
                    class="custom-login-button custom-resend-otp-btn slds-p-around_x-small slds-size_1-of-2"
                    onclick={handleSendOtp}>Resend Code
                </button>
                <button class="custom-login-button slds-p-around_x-small slds-size_1-of-2" onclick={handleVerifyOtp}
                    disabled={disableVerifyButton}>
                    Verify Code </button>
            </div>

            <div class="back-container slds-var-m-vertical_medium slds-grid slds-grid_align-center">
                <button class="custom-otp-back-btn custom-login-button slds-p-around_small slds-size_2-of-3"
                    onclick={backButton}>Login with another account</button>
            </div>
        </div>

        <!--<lightning-layout multiple-rows>
        <lightning-layout-item size="12" padding="around-small" small-device-size="3" medium-device-size="6" large-device-size="3">
            <button class="back-button custom-login-button slds-m-vertical_large slds-size_3-of-3 slds-button slds-p-around_x-small slds-grid_align-center  " onclick={backButton}>Back</button>
        </lightning-layout-item>
    </lightning-layout>-->
    </template>
</template>
