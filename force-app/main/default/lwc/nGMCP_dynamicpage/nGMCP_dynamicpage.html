<template>
    <template if:true={selectedRecordId}>
        <c-n-g-m-c-p_dynamicpage record-id={selectedRecordId} object-api-name={objectApiName}
            record-type-name={objectApiName}></c-n-g-m-c-p_dynamicpage>
    </template>
    <template if:false={selectedRecordId}>
        <div class="custom-dynamic-detailpage-container">
            <!-- GLOBAL LOADING -->
            <template if:true={loading}>
                <div class="slds-p-around_medium">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>
            <!-- DOWNLOAD LOADING -->
            <template if:true={isLoading}>
                <div class="slds-p-around_small">
                    <lightning-spinner alternative-text="Downloading..." size="small"></lightning-spinner>
                </div>
            </template>
            <!-- DOWNLOAD BUTTON -->
            <!-- <div class="button-bar custom-dynamic-btn-section slds-var-m-horizontal_medium slds-var-m-bottom_medium slds-grid
                                                    slds-grid_align-end">
                <button class="btn custom-btn-plain" onclick={handleBackButton}>Back</button>
            </div>
            <template if:true={showdownloadRams}>
                <div class="button-bar custom-dynamic-btn-section 
                    slds-var-m-horizontal_medium 
                    slds-var-m-bottom_medium 
                    slds-grid 
                    slds-grid_align-end">
                    <button class="btn custom-btn-plain" onclick={handleDownloadFiles}>
                        Download RAMS
                    </button>
                </div>
            </template> -->
            <div class="button-bar custom-dynamic-btn-section
                        slds-var-m-horizontal_medium 
                        slds-var-m-bottom_medium 
                        slds-grid 
                        slds-grid_align-end 
                        slds-gutters">

                <button class="btn custom-btn-plain" onclick={handleBackButton}>
                    Back
                </button>

                <template if:true={showdownloadRams}>
                    <button class="btn custom-btn-plain" onclick={handleDownloadFiles}>
                        Download RAMS
                    </button>
                </template>

            </div>
            <!-- ERROR -->
            <template if:true={error}>
                <div class="slds-p-around_medium">
                    <div class="slds-notify_alert slds-theme_error" role="alert">
                        <h2 class="slds-text-color_error">{errorMessage}</h2>
                    </div>
                </div>
            </template>
            <!-- READY CONTENT -->
            <template if:true={ready}>
                <template if:true={recordDisplayName}>
                    <p class="mprn-detail-title">{recordDisplayName}</p>
                </template>
                <template for:each={activeSections} for:item="section">
                    <div key={section.key} class="details-column 
                            slds-col 
                            slds-var-p-vertical_x-small 
                            slds-var-p-horizontal_small">
                        <div class="section-header 
                                slds-grid 
                                slds-p-horizontal_medium 
                                slds-grid_align-spread 
                                slds-var-p-vertical_x-small">
                            <h3 class="mprn-detail-section-title slds-col">
                                {section.label}
                            </h3>
                        </div>
                        <lightning-record-view-form record-id={recordId} object-api-name={objectApiName}>
                            <div class="details-box 
                                    slds-p-horizontal_medium 
                                    slds-grid 
                                    slds-wrap">
                                <template for:each={section.fields} for:item="fld">
                                    <div key={fld} class="mprn-detail-row 
                                            with-border 
                                            slds-p-horizontal_medium 
                                            slds-p-vertical_xx-small 
                                            slds-grid 
                                            slds-grid_align-spread 
                                            slds-size_1-of-2">
                                        <lightning-output-field class="mprn-detail-label slds-col" field-name={fld}>
                                        </lightning-output-field>
                                    </div>
                                </template>
                            </div>
                        </lightning-record-view-form>
                    </div>
                </template>
                <template if:true={lists}>
                    <template for:each={lists} for:item="rl">
                        <section key={rl.id} class="slds-card slds-var-m-around_small custom-related-list-section">

                            <!-- SECTION HEADER: keep visible always -->
                            <header
                                class="section-header slds-grid slds-grid_align-spread slds-var-p-horizontal_medium slds-var-p-vertical_x-small">
                                <div
                                    class="section-header__left slds-grid slds-var-p-horizontal_medium slds-grid_vertical-align-center slds-has-flexi-truncate">
                                    <h2 class="slds-text-heading_small slds-truncate" title={rl.label}>
                                        {rl.label}
                                        <template if:true={rl.count}>
                                            <span class="slds-text-title_caps">({rl.count})</span>
                                        </template>
                                    </h2>
                                </div>
                                <!-- Removed New button intentionally -->
                            </header>

                            <!-- TABLE-LIKE AREA -->
                            <div class="dt-wrapper">
                                <div class="dt-scroll">
                                    <!-- Column headers -->
                                    <template if:true={rl.count}>
                                        <div class="dt-row dt-row--header" role="row" style={rl.gridTemplate}>
                                            <!-- Name header (NON-HISTORY ONLY) -->
                                            <template if:false={rl.specialHistory}>
                                                <div class="dt-cell dt-cell--header dt-cell--sortable"
                                                    role="columnheader" tabindex="0" aria-sort={rl.firstColumnAriaSort}
                                                    data-sort-key="__link__" data-rlid={rl.id} onclick={handleSortClick}
                                                    onkeydown={handleSortKeydown}>
                                                    <span class="slds-truncate">Name</span>
                                                </div>
                                            </template>
                                            <!-- Dynamic headers -->
                                            <template for:each={rl.columns} for:item="col">
                                                <div key={col.fieldName}
                                                    class="dt-cell dt-cell--header dt-cell--sortable"
                                                    role="columnheader" tabindex="0" aria-sort={col.ariaSort}
                                                    data-sort-key={col.fieldName} data-rlid={rl.id}
                                                    onclick={handleSortClick} onkeydown={handleSortKeydown}>
                                                    <span class="slds-truncate">{col.label}</span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <!-- Data rows -->
                                    <template if:true={rl.count}>
                                        <template for:each={rl.rows} for:item="row">
                                            <div key={row.Id} class={row.rowClass} role="row" style={rl.gridTemplate}>
                                                <!-- Name / Link cell (NON-HISTORY ONLY) -->
                                                <template if:false={rl.specialHistory}>
                                                    <div class="dt-cell dt-cell--link" role="cell">
                                                        <a href={row.recordUrl} class="slds-truncate dt-link"
                                                            title={row.linkLabel} data-id={row.Id} target={row.target}
                                                            onclick={handleLinkClick}>
                                                            {row.linkLabel}
                                                        </a>
                                                    </div>
                                                </template>
                                                <!-- Value cells -->
                                                <template for:each={row.cells} for:item="cell">
                                                    <div key={cell.api} class="dt-cell" role="cell" title={cell.value}>
                                                        <span class="slds-truncate">{cell.value}</span>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </template>
                                    <!-- Empty state -->
                                    <template if:false={rl.count}>
                                        <div class="dt-empty" role="row" style={rl.gridTemplate}>
                                            <div class="dt-cell dt-cell--empty" role="cell">
                                                <span class="slds-truncate">No records</span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </section>
                    </template>
                </template>
                <!-- FALLBACK -->
                <template if:true={showNoConfig}>
                    <div class="slds-text-color_error slds-m-top_small">
                        No section configuration found for Record Type
                        <strong>{activeRecordTypeDevName}</strong>.
                    </div>
                </template>
            </template>
        </div>
    </template>
</template>
