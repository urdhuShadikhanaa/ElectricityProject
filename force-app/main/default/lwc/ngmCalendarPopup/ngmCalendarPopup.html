<template>
    <div class="calendar-container">
        <lightning-button label="Open Calendar" onclick={openCalendar}></lightning-button>

        <template if:true={showCalendar}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeCalendar}>
                            ✖
                        </button>
                        <h2 class="slds-text-heading_medium">Select a Date</h2>
                    </header>
                    <div class="slds-modal__content calendar-grid">
                        <template for:each={calendarDays} for:item="day">
                            <button key={day.date}
                                class={day.class}
                                value={day.date}
                                onclick={handleDateSelect}
                                disabled={day.disabled}>
                                {day.label}
                            </button>
                        </template>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
