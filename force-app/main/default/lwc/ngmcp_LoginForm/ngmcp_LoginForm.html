                                    Forgot password?

                            <div class="custom-line-with-text slds-grid slds-grid_align-center slds-size_3-of-3">

                            <div class="slds-grid slds-grid_align-center slds-m-vertical_large">
                                <a href={ssoURL} class="slds-grid slds-size_full custom-login-sso-link" target="_self">
                                    <button class="custom-login-button slds-button slds-p-around_x-small slds-grid_align-center slds-size_full">Login

                                <label class="custom-label" for="password">Password</label>

                                <button

                            <template if:true={showErrorMessage}>
                                <div class="error-message">
                                    <p>{errorMessage}</p>
                                </div>
                            </template>
                            
                        </div>
                
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </template>
     <template if:true={otpPage}>
        <div class="otp-card">
        <div class="otpVerifyText">Verify OTP</div>

        <div class="form-group">
            <lightning-input 
                label="Enter OTP" 
                name="otp" 
                type="text"
                max = 6 
                value={otp} 
                onchange={handleOtpChange}>
            </lightning-input>
        </div>

        <template if:true={showErrorMessage}>
            <div class="error-message">
                <p>{errorMessage}</p>
            </div>
        </template>
        
        <div class="resend-container">
            <lightning-button 
                variant="base" 
                label="Resend OTP" 
                title="Resend OTP" 
                onclick={handleSendOtp}>
            </lightning-button>
        </div>

        <button class="verify-otp-button" onclick={handleVerifyOtp} disabled={disableVerifyButton}>
            Verify
        </button>
    </div>

    <lightning-layout multiple-rows>
        <lightning-layout-item size="12" padding="around-small" small-device-size="3" medium-device-size="6" large-device-size="3">
            <button class="back-button" onclick={backButton}>Back</button>
        </lightning-layout-item>
    </lightning-layout>
    </template>
</template>
