<template>
    <div class="slds-box slds-theme_default slds-p-around_medium">
        <!-- Submit button -->
        <lightning-button
            variant="brand"
            label="Submit"
            title="Submit urgent work request"
            onclick={handleSubmit}>
        </lightning-button>

        <!-- Optional status/debug text -->
        <p class="slds-m-top_small slds-text-color_weak">
            {statusMsg}
        </p>
    </div>

    <!-- =========================
         SLDS Modal (controlled by showModal)
         ========================= -->
    <template if:true={showModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="modal-heading"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Header -->
                <header class="slds-modal__header">
                    <h2 id="modal-heading" class="slds-text-heading_medium">
                        Submission Confirmed
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{confirmMessage}</p>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        variant="neutral"
                        label="Close"
                        onclick={closeModal}>
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="OK"
                        onclick={confirmModal}>
                    </lightning-button>
                </footer>
            </div>
        </section>

        <!-- Backdrop -->
        <div class="slds-backdrop slds-backdrop_open" onclick={closeModal}></div>
    </template>
</template>
