<template>
  <div class="dp-container">
    <!-- Input field that toggles calendar -->
    <div class="input-wrapper">
      <lightning-input type="text"  value={selectedDateLabel} onclick={toggleCalendar}
    readonly
    autocomplete="off"
    onkeydown={blockManualEdit}
    onpaste={blockManualEdit}
    ondrop={blockManualEdit}
    oninput={snapBackIfTyped}
></lightning-input>
      <svg xmlns="http://www.w3.org/2000/svg" onclick={toggleCalendar}
         height="20px" viewBox="0 -960 960 960" width="20px" fill="#555555"><path d="M480.21-384q-15.21 0-25.71-10.29t-10.5-25.5q0-15.21 10.29-25.71t25.5-10.5q15.21 0 25.71 10.29t10.5 25.5q0 15.21-10.29 25.71t-25.5 10.5Zm-156 0q-15.21 0-25.71-10.29t-10.5-25.5q0-15.21 10.29-25.71t25.5-10.5q15.21 0 25.71 10.29t10.5 25.5q0 15.21-10.29 25.71t-25.5 10.5Zm312 0q-15.21 0-25.71-10.29t-10.5-25.5q0-15.21 10.29-25.71t25.5-10.5q15.21 0 25.71 10.29t10.5 25.5q0 15.21-10.29 25.71t-25.5 10.5Zm-156 144q-15.21 0-25.71-10.29t-10.5-25.5q0-15.21 10.29-25.71t25.5-10.5q15.21 0 25.71 10.29t10.5 25.5q0 15.21-10.29 25.71t-25.5 10.5Zm-156 0q-15.21 0-25.71-10.29t-10.5-25.5q0-15.21 10.29-25.71t25.5-10.5q15.21 0 25.71 10.29t10.5 25.5q0 15.21-10.29 25.71t-25.5 10.5Zm312 0q-15.21 0-25.71-10.29t-10.5-25.5q0-15.21 10.29-25.71t25.5-10.5q15.21 0 25.71 10.29t10.5 25.5q0 15.21-10.29 25.71t-25.5 10.5ZM216-96q-29.7 0-50.85-21.5Q144-139 144-168v-528q0-29 21.15-50.5T216-768h72v-96h72v96h240v-96h72v96h72q29.7 0 50.85 21.5Q816-725 816-696v528q0 29-21.15 50.5T744-96H216Zm0-72h528v-360H216v360Z"/>
      </svg>
    </div>

    <template if:true={isCalendarOpen}>
  <div class="calendar-popup" onclick={handleCalendarClick}>
        <div class="dp-header">
         <button type="button" class="nav" onclick={handlePrev}>Previous</button>
<span class="month-label">{monthLabel}</span>
<button type="button" class="nav" onclick={handleNext}>Next</button>

        </div>

        <div class="week-days">
          <template for:each={weekDays} for:item="wd">
            <div key={wd} class="wd">{wd}</div>
          </template>
        </div>

        <div class="days-grid">
          <template for:each={calendarDays} for:item="cd">
            <div key={cd.key}
                 class={cd.cssClass}
                 data-date={cd.iso}
                 onclick={handleSelectDate}
                 role="button"
                 tabindex="0">
              <span class="date-num">{cd.day}</span>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>
</template>
