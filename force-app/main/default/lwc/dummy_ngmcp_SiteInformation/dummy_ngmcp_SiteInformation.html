<template>
    <!-- Show button only when flag = Yes -->
    <template if:true={showActionButton}>
        <lightning-button label="Provide Site Contact Details" variant="brand" onclick={openFormModal}>
        </lightning-button>
    </template>
    <!-- Modal -->
    <template if:true={showFormModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Provide Site Contact Details</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Title" required data-field="title" value={title} onchange={handleChange}>
                    </lightning-input>
                    <lightning-input label="Name" required data-field="name" value={nameVal} onchange={handleChange}>
                    </lightning-input>
                    <lightning-input label="Contact Number" required type="tel" data-field="phone" value={phone}
                        onchange={handleChange}>
                    </lightning-input>
                    <lightning-textarea label="Access Instructions" required data-field="access" value={access}
                        onchange={handleChange}>
                    </lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeFormModal}></lightning-button>
                    <lightning-button variant="brand" label="Submit" onclick={handleSubmit}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- Popup -->
    <template if:true={showPopup}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{popupTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    {popupMessage}
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="OK" variant="brand" onclick={closePopup}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
